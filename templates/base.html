<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SK-EMIS{% endblock %} | SPE Kyambogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">SK-EMIS</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
      <a class="nav-link" href="{% url 'project_list' %}">Projects</a>
      {% if user.is_staff %}<a class="nav-link" href="{% url 'admin:index' %}">Admin</a>{% endif %}
    </div>
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2">
      {% csrf_token %}
      <span class="text-light small">{{ user }}</span>
      <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% block content %}{% endblock %}
</main>
</body>
</html>
