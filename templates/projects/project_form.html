{% extends "base.html" %}
{% block title %}{% if object %}Edit project{% else %}New project{% endif %}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if object %}Edit project{% else %}New project{% endif %}</h1>
<div class="card"><div class="card-body">
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="btn btn-primary mt-3" type="submit">Save</button>
    <a class="btn btn-link mt-3" href="{% url 'project_list' %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
