{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1 class="h3 mb-1">{{ heading }}</h1>
<p class="text-muted">Project: <a href="{{ project.get_absolute_url }}">{{ project.title }}</a></p>
<div class="card"><div class="card-body">
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="btn btn-primary mt-3" type="submit">Save</button>
    <a class="btn btn-link mt-3" href="{{ project.get_absolute_url }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
